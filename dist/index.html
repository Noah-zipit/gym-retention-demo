<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RetainFit — gym member-retention demo. No-show red list, QR check-ins, auto renewals, add-on upsells.">
  <meta name="theme-color" content="#0A0D12">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RetainFit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RetainFit — Gym Retention OS</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0A0D12;
      height: 100%;
      overflow: hidden;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 80% 60% at 50% 30%, #14202E 0%, #0A0D12 70%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #C8FF3D;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 800;
      color: #0A0D12;
      margin-bottom: 20px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    #loading .name {
      color: #F4F7F2;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    #loading .sub {
      color: #8B95A9;
      font-size: 13px;
      margin-bottom: 26px;
    }
    #loading .bar {
      width: 180px;
      height: 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.10);
      overflow: hidden;
    }
    #loading .bar > div {
      height: 100%;
      width: 40%;
      border-radius: 4px;
      background: #C8FF3D;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(450%); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">R</div>
    <div class="name">RetainFit</div>
    <div class="sub">Warming up your demo…</div>
    <div class="bar"><div></div></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('done');
        setTimeout(function () { el.remove(); }, 500);
      }
    });
    // Safety net: never trap the user on the loader for more than 60s.
    setTimeout(function () {
      var el = document.getElementById('loading');
      if (el) { el.classList.add('done'); setTimeout(function(){ el.remove(); }, 500); }
    }, 60000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
